   {t:"Wipe it away and start injecting. Deal with the face at the end.",c:"Purge kept running over unprotected skin during injection. The skin around the mouth and nose discolored. (EHTP p. 330)"}]},
  a1b:{t:"The abdomen",s:"The abdomen is tense and distended. Tapping one flank sends a fluid wave to the other side.",o:[
   {t:"Relieve it now, before injection: make a small incision in the inguinal or hypogastric area and drain the ascites with a drain tube or trocar kept just under the abdominal wall.",ok:1,next:"a1c",c:"A tense abdomen presses on the vessels and can block distribution and drainage. Removing the pressure first lets the arterial solution and drainage move. (EHTP p. 311; p. 216)"},
   {t:"Leave it for cavity treatment after arterial injection.",go:"a1bx",c:"You started injection with the abdomen still tense."},
   {t:"Push the trocar deep toward the spine to reach all the fluid.",c:"Going deep risks piercing the large vessels of the trunk. Keep the trocar just under the anterior abdominal wall. (EHTP p. 311)"}]},
  a1bx:{t:"Poor distribution",ev:"Things got worse",s:"Ten minutes into injection, drainage is weak, the legs aren't clearing, and purge is pouring from the nose and mouth.",o:[
   {t:"Stop injecting. Relieve the ascites through a small inguinal incision with a drain tube or trocar, then resume.",ok:1,next:"a1c",c:"Ascites pressure was blocking drainage and pushing out purge. Relieving it lets injection continue. (EHTP p. 311; p. 319)"},
   {t:"Turn up the pressure to push past it.",c:"More pressure against a tense abdomen made the purge worse and the face started to swell."},
   {t:"Keep going and aspirate everything at the end.",c:"The lower body never cleared and purge soaked the head block."}]},
  a1c:{t:"The right leg",s:"Before you inject, look at the right shin again: fluid-filled blisters, and loose skin that slides when rubbed.",o:[
   {t:"Disinfect, open and drain the blisters, remove all loose skin now, and apply cavity fluid compresses or autopsy gel to the raw areas.",ok:1,next:"aG",c:"Loose skin is removed before arterial injection. Compresses start preserving and drying the raw tissue while you embalm. (EHTP p. 296; p. 310)"},
   {t:"Leave the blisters and skin alone until after arterial injection.",c:"Solution leaked into the blisters and under the loose skin during injection. More skin slipped. (EHTP p. 296)"},
   {t:"Cover the leg with massage cream.",c:"Cream keeps the area wet. Raw areas need to dry. (EHTP p. 305)"}]},
  aG:{t:"Starting injection",s:"He died of congestive heart failure with edema and kidney disease. How do you start the arterial injection?",o:[
   {t:"Start with a mild first gallon to clear the blood congestion and discolorations, then switch to stronger solution for the rest.",ok:1,next:"a2",c:"With heart failure, a mild first gallon clears the congestion. Stronger solutions follow to meet the preservative demand of the edema. (EHTP p. 319)"},
   {t:"Use the strong solution from the very first ounce.",c:"The strong solution set the blood in place before it drained. The face and neck stayed congested and dark. (EHTP p. 319)"},
   {t:"Run a full gallon of pre-injection fluid first.",c:"In renal failure, pre-injection can make tissues swell easily. The face and hands puffed up. (EHTP p. 336)"}]},
  a2:{type:"shelf",waterless:1,sd:"Kidney failure adds to the demand. Nitrogenous wastes neutralize formaldehyde, so this body needs even more preservative than edema alone (EHTP p. 336). What goes in the tank isn't what the tissues end up with. Plan for the strength that will be left after the edema and the kidney wastes take their share.",t:"Trunk tank",s:"After the mild first gallon, build the strong tank for the trunk and legs. Click bottles to add them. You need one arterial fluid and one co-injection. Then set the tank size and bottles to get the right strength.",need:{art:"b3",co:"b5"},next:"aM",mix:{gal:2,min:6,max:10,co:[1,3],good:"Strong enough to meet a very high preservative demand. Think of it this way: the edema dilutes a 6% tank down to about 4 to 5% in the tissues, and the kidney wastes cancel out another 1 to 2%. That leaves an actual working strength of about 2 to 3%. (EHTP p. 308; p. 336)",low:"Severe edema on top of kidney failure needs at least 6%. Consider the secondary dilution: the excess fluid in the edematous tissues dilutes the solution further once it's injected (EHTP p. 308; p. 206). Kidney failure raises the demand even more. Nitrogenous wastes neutralize formaldehyde, and it has been estimated that six times more preservative is needed (EHTP p. 336). Think of it this way: the edema dilutes a 6% tank down to about 4 to 5% in the tissues, and the kidney wastes cancel out another 1 to 2%. That leaves an actual working strength of about 2 to 3%.",high:"It firmed, but it wasted fluid and started to gray the tissues."},fb:{
   b9:"Not for this case. With kidney failure, pre-injection may not be advised because the tissues swell easily. (EHTP p. 336)",
   b1:"This adds moisture to tissue that is already waterlogged. The face and legs would swell more. (EHTP p. 309)",
   b2:"A medium index gets diluted by all the extra tissue water. With kidney failure, a high-index fluid is advised. (EHTP p. 336)",
   b3:"Right pick. A high index stays strong enough after the edema dilutes it, and kidney failure calls for high-index fluid. (EHTP p. 336)",
   b4:"Humectants hold moisture in. That is the opposite of what this body needs.",
   b5:"Right pick. Edema corrective makes the solution hypertonic, which draws edema out of the tissue spaces into the drainage. (EHTP p. 117)",
   b7:"Cavity fluid is far too harsh to inject arterially. It goes in by trocar after arterial injection.",
   b8:"Tissue builder fills sunken areas. His face is swollen, not sunken."}},
  aM:{t:"Injection method",s:"How will you inject this body? Keep the swollen face and the family's request in mind.",o:[
   {t:"One-point injection: inject from the right common carotid and drain from the right internal jugular",c:"From one site you can't hold strong solution back from the head. By the time the trunk got enough, the face was overinjected and swollen."},
   {t:"Restricted cervical injection: raise both common carotids, inject the trunk with the tubes to the head left open, then inject the head separately with a milder solution",ok:1,next:"a4",c:"Restricted cervical injection lets you send strong solution to the trunk while controlling what reaches the face. It is the recommended method for generalized edema. (EHTP p. 309; p. 183)"},
   {t:"Six-point injection from the start",c:"Six-point injection is for when distribution fails. Six incisions up front on a body with edema gave you six more places to leak. (EHTP p. 308)"},
   {t:"Inject from the right femoral only, toward the head",c:"You had no control over how much strong solution reached the face. The face swelled before the trunk was done."}]},
  a4:{t:"Raising the vessel",ev:"Complication",s:"You raise the right common carotid. It feels hard and gritty, which is less common in the carotid. When you start to insert the arterial tube, you feel it catch on a thick, hard spot.",o:[
   {t:"Don't force it. Choose a part of the artery without fatty deposits, use a smaller arterial tube, secure it with an arterial hemostat or thick cotton ligature, and start at low pressure and a slow rate.",ok:1,next:"a6",c:"Forcing a tube into a sclerotic artery can slough the lining and block it. An unaffected spot, a smaller tube, and a gentle start protect the vessel. (EHTP p. 315)"},
   {t:"Push the tube through and start the machine.",go:"a4x",c:"The lining tore and the wall cracked."},
   {t:"Raise the pressure to push past the hard spot.",go:"a4x",c:"The weakened wall split under the pressure."},
   {t:"Give up on the carotids and inject from the right femoral.",c:"The femoral is more often sclerotic than the carotid, and you lose the control of the face that restricted cervical injection gives you. (EHTP p. 315; p. 183)"}]},
  a4x:{t:"Leak in the neck",ev:"Things got worse",s:"Solution is pooling under the skin of the neck. The right side of the neck is swelling.",o:[
   {t:"Stop the machine, tie off the damaged section, express the fluid toward the incision, and re-cannulate the artery in an unaffected area with a smaller tube.",ok:1,next:"a6",c:"Stopping fast limits the swelling. A fresh, unaffected spot and a smaller tube let you keep the restricted cervical plan. (EHTP p. 315)"},
   {t:"Turn the pressure up so more solution gets past the leak.",c:"The neck swelled badly and the right side of the face distorted."},
   {t:"Keep injecting and cover it with cosmetics later.",c:"Cosmetics cannot hide a swollen neck. The collar no longer fit."}]},
  a6:{t:"Drainage",ev:"Complication",s:"You are injecting the trunk. Drainage from the right internal jugular vein is slow and thick with clots.",o:[
   {t:"Keep drainage continuous and use angular spring forceps to remove the clots from the right atrium.",ok:1,next:"a5",c:"Continuous drainage removes edema in this case. Angular spring forceps reach heavy clots in the right atrium. (EHTP p. 309; p. 320)"},
   {t:"Close the drainage until the clots break up on their own.",c:"Pressure built with nowhere to go. Swelling and purge increased."},
   {t:"Increase the pressure to push the clots out.",go:"a6x",c:"Pressure is building against blocked drainage."}]},
  a6x:{t:"Face swelling",ev:"Things got worse",s:"The neck veins are bulging and the face is swelling and darkening.",o:[
   {t:"Lower the pressure, clear the clots with angular spring forceps, and open drainage from the left internal jugular too.",ok:1,next:"a5",c:"Lower pressure stops the swelling. Draining from both internal jugulars is recommended when the face has severe edema. (EHTP p. 309; p. 320)"},
   {t:"Keep the pressure up. It will break through.",c:"The face distended further and the eyelids no longer closed."},
   {t:"Massage the face hard to push the fluid out.",c:"Heavy massage on swollen, fragile skin tore the surface."}]},
  a5:{t:"Injecting the head",ev:"Watch the face",s:"The trunk is done. You are injecting the head with a milder solution through the carotids toward the head. A small volume is in. The eyelids are starting to puff.",o:[
   {t:"Stop the head injection. The tissue is firming. Close off the carotid tubes and move on.",ok:1,next:"a7",c:"In edematous tissue a small volume goes a long way. Overinjecting the head distends the face. (EHTP p. 309)"},
   {t:"Keep going until the full gallon is in.",c:"The eyelids distended and the face no longer looked like him."},
   {t:"Close the drainage so the face firms faster.",c:"Closing drainage pushed more fluid into the face. The swelling got worse."}]},
  a7:{t:"The left leg",s:"The strong tank is running. The right leg is clearing and taking dye. The left leg shows no dye and isn't firming.",o:[
   {t:"Keep injecting while you massage along the left femoral artery and behind the knee, flex the leg, and turn the foot inward to squeeze the muscles. Watch for dye.",ok:1,next:"a7m",c:"Massage and manipulation along the arterial route can pull solution into an area that isn't receiving it. Don't overdo it. Too much manipulation can cause swelling, dehydration, and skin slip. (EHTP p. 204; p. 196)"},
   {t:"Stop and raise the left femoral right away.",c:"That may come next. First try massage and manipulation while the general injection runs. Sectional injection is for areas that still don't receive solution after that. (EHTP p. 153; p. 204)"},
   {t:"Massage cream into the leg.",c:"Cream holds moisture in. It does nothing for distribution. The leg stayed soft and wet."},
   {t:"Reinject from the right side at higher pressure.",c:"The solution followed the easier path and never reached the left leg."}]},
  a7m:{t:"After massage",s:"After several minutes of massage and flexing, some dye shows in the left thigh. The lower leg is still soft and swollen, with no dye.",o:[
   {t:"Raise the left femoral and inject the left leg separately with strong solution. Elevate the leg and wrap it with an elastic bandage from the foot up.",ok:1,next:"a8",c:"Massage helped the thigh but didn't reach the lower leg. It doesn't always work. Areas that still don't receive solution get sectional injection. Elevating and wrapping pushes edema toward the pelvic cavity where it can be aspirated. (EHTP p. 153; p. 310)"},
   {t:"Keep massaging harder until the lower leg clears.",c:"Over-manipulating edematous tissue can cause swelling, dehydration, and skin slip. The lower leg needs its own injection. (EHTP p. 204; p. 153)"},
   {t:"Call it done. Some dye made it into the leg.",c:"Areas that don't receive solution even after massage need sectional injection. The lower leg would stay soft. (EHTP p. 153)"}]},
  a8:{t:"Checking the right leg",s:"Injection is done. The raw areas on the right shin are still moist and soft.",o:[
   {t:"Continue the compresses or inject cavity fluid hypodermically, give the chemicals time, clean them away, dry with a hair dryer, then use autopsy gel, powder, and plastic garments.",ok:1,next:"a9",c:"Raw areas need preserving and drying before dressing. Plastic garments with powder protect the clothing. (EHTP pp. 296 to 297)"},
   {t:"Cover them with massage cream and dress him.",c:"Cream kept the areas wet. They leaked through the clothing at the viewing."},
   {t:"Leave them. The arterial solution took care of it.",c:"The arterial solution didn't fully reach the raw areas. They stayed soft and leaked."}]},
  a9:{t:"Cavity treatment",s:"Arterial injection is done. The abdomen still holds fluid, and a little purge has returned at the nose.",o:[
   {t:"Aspirate thoroughly, inject a full amount of undiluted cavity fluid, then reaspirate and reinject. Clean and pack the nose with cotton.",ok:1,end:1,c:"Ascites dilutes cavity fluid, and kidney failure needs thorough cavity treatment, so reaspiration and reinjection are best practice. Pack the nose after embalming. (EHTP pp. 308, 314, 320)"},
   {t:"Leave the abdomen alone. It will go down on its own.",c:"It did not go down. The abdomen stayed distended and purge came back at the viewing."},
   {t:"Aspirate once and use the normal amount of cavity fluid.",c:"The leftover ascites diluted the cavity fluid. Gas and odor developed before the funeral. (EHTP p. 308)"},
   {t:"Cover the nose with cosmetics.",c:"Cosmetics do not stop purge. Fluid stained the pillow."}]}
 }
},
{
 code:"W12-B",
 look:{sex:"f",head:47,hair:"#c4c0ba",hairStyle:"long",eyes:"sunken",lips:"dry",cheeks:"hollow",temples:true,purge:false,abd:false,arm:30,rhand:.85,lhand:1.25,lIV:true,thigh:46,lower:36,ribs:true,port:true,wrinkledR:true},
 file:{Decedent:"Female, 81",Cause:"Metastatic cancer",Place:"Home, under hospice care",Interval:"10 hours, not refrigerated",Weight:"Lost a lot of weight in the last months",Service:"Open casket, viewing in 2 days"},
 request:"She stopped eating weeks ago. Please don't let her look so thin and tired.",
 exam:{
  face:{o:"Cheeks and temples hollow. The bones of the face stand out. Eyes sit back in the sockets.",a:"Emaciation"},
  mouth:{o:"Lips are dry, hard, and brown, with the edges starting to curl.",a:"Desiccation"},
  chest:{o:"Ribs show through the skin. A port sits below the right clavicle with no swelling around it.",a:"No moisture-related finding"},
  abd:{o:"Flat and soft. No distention.",a:"No moisture-related finding"},
  rarm:{o:"Skin stays up in a ridge after you pinch it. Fingertips are wrinkled.",a:"Dehydration"},
  larm:{o:"Hand and wrist puffy around a taped IV site where the line leaked into the tissue. Pressing leaves a pit.",a:"Pitting edema"},
  rleg:{o:"Thin but unremarkable. No swelling or skin breaks.",a:"No moisture-related finding"},
  lleg:{o:"Thin but unremarkable. No swelling or skin breaks.",a:"No moisture-related finding"}
 },
 start:"b1",
 nodes:{
  b1:{t:"Before injection",s:"The prep room is cool and dry. Her face and lips are drying out in the room air while you set up.",o:[
   {t:"Apply a light coat of massage cream to the face, lips, and hands, and keep the body covered.",ok:1,next:"b2",c:"Massage cream and coverings slow surface drying during and after embalming. (EHTP p. 304; p. 306)"},
   {t:"Leave the face uncovered so you can watch it during injection.",c:"Air moving across the body dried the lips and eyelids further. (EHTP p. 306)"},
   {t:"Wipe the face with solvent to clean it.",c:"Solvent dehydrates the skin. The lips cracked. (EHTP p. 305)"}]},
  b2:{type:"shelf",t:"Build your tank",s:"Look back at your findings. Click bottles to add them to the tank. You need one arterial fluid. A co-injection is up to you. Then set the tank size and bottles to get the right strength.",need:{art:"b1",co:null},opt:["b4"],next:"bM",mix:{gal:2,min:2,max:4,good:"A 2 to 4% solution preserves her for a 2-day wait without over-drying. (EHTP p. 304; p. 306)",low:"Too weak to preserve her for a 2-day wait. Areas stayed soft and began to discolor. (EHTP p. 306)",high:"It pulled moisture from her face and fingers. The wrinkling and browning got worse. (EHTP p. 151)"},fb:{
   b9:"Good choice as a co-injection. It conditions the vessels and helps clear drug residue from her cancer treatment. Your humectant arterial does the work of filling out the hollow tissue.",
   b1:"Right pick. A lower index lets you keep the strength mild to moderate without over-drying her. (EHTP p. 151)",
   b2:"It would work at a mild strength, but the lower index gives you more room to add volume without over-drying. There is a better fit on the shelf.",
   b3:"A high index pulls more moisture out of tissue that is already dry. Her face would wrinkle and darken. (EHTP p. 151)",
   b4:"Optional. Your arterial fluid already has humectant built in, so you don't need to add more. If you do, keep it modest. Too much humectant has the opposite effect and dehydrates. (EHTP p. 306)",
   b5:"Edema corrective removes water. She needs more moisture, not less. The swollen hand gets treated separately.",
   b7:"Cavity fluid is far too harsh to inject arterially. It goes in by trocar after arterial injection.",
   b8:"Tissue builder fills hollows, but it goes in by hypodermic after arterial injection. It never goes in the tank. (EHTP p. 118)"}},
  bM:{t:"Injection method",s:"How will you inject her? The family wants her to look less thin.",o:[
   {t:"One-point injection from the right common carotid and right internal jugular",c:"It preserved her, but injecting so close to the face filled the right side first. The face came out uneven. (EHTP p. 182)"},
   {t:"Split injection: inject from the right femoral artery toward the head, and drain from the right internal jugular with restricted drainage",ok:1,next:"b4",c:"Injecting from the femoral lets solution reach both carotids at once. The distance slows it down, so the face fills out gradually and evenly. (EHTP p. 182; pp. 461 to 462)"},
   {t:"Restricted cervical injection",c:"Restricted cervical injection is made to hold solution back from the face. She needs the opposite. (EHTP p. 183)"},
   {t:"Six-point injection from the start",c:"Her skin is thin and fragile. Six incisions gave you six places to leak, with no distribution problem to fix."}]},
  b4:{t:"Raising the vessel",ev:"Look closely",s:"You open the right femoral incision. The first vessel you lift is thin-walled, bluish, and flattens when you press it. It sits medial to a thicker, rounder vessel.",o:[
   {t:"That is the femoral vein. Leave it, since you're draining from the jugular. The artery is the thicker vessel lateral to it.",ok:1,next:"b5",c:"The femoral artery lies lateral to the femoral vein. Arteries have thick walls and hold their shape; veins are thin and collapse. (EHTP p. 135; p. 140)"},
   {t:"Insert the arterial tube into it and start injecting.",go:"b4x",c:"You are injecting into the vein."},
   {t:"Close up. The artery must be blocked, so move to the carotid.",c:"The artery was right there, lateral to the vein. You lost the benefit of split injection for her face."}]},
  b4x:{t:"Wrong vessel",ev:"Things got worse",s:"Solution is going into the femoral vein. Nothing reaches the face, the leg is swelling, and drainage at the jugular looks like solution.",o:[
   {t:"Stop, remove the tube, tie off the vein, and cannulate the femoral artery lateral to it.",ok:1,next:"b5",c:"Stopping early limits the swelling. Now the artery carries solution out to the tissues and the jugular brings blood back. (EHTP p. 135)"},
   {t:"Keep injecting. It will find its way.",c:"Solution ran straight back to the heart through the veins. The leg swelled and nothing was preserved."},
   {t:"Raise the pressure.",c:"The leg swelled tight and solution leaked from the incision."}]},
  b5:{t:"Drainage",s:"Injection is running from the femoral toward the head. How do you manage drainage at the jugular?",o:[
   {t:"Continuous drainage the whole time",go:"b5x",c:"Most of the humectant solution is running straight out with the drainage."},
   {t:"Restricted or intermittent drainage, then close drainage completely for the last of the solution",ok:1,next:"b5m",c:"Restricting drainage builds pressure so solution enters and stays in the facial tissues. Closing it for the last portion helps fill out the features. (EHTP p. 117; p. 462)"},
   {t:"No drainage at all from the start",c:"The blood stayed in the vessels. The face and neck discolored."}]},
  b5x:{t:"Lips and fingers drying",ev:"Things got worse",s:"Her lips, fingertips, and the backs of her hands are wrinkling and darkening during injection.",o:[
   {t:"Switch to intermittent drainage, then close drainage for the last of the solution. Reapply massage cream.",ok:1,next:"b5m",c:"With continuous drainage, humectant solutions pull moisture from the lips and fingers. Intermittent drainage holds the humectant in the tissues. (EHTP p. 117)"},
   {t:"Add more humectant to the tank.",c:"Too much humectant has the opposite effect. The drying got worse. (EHTP p. 306)"},
   {t:"Massage the hands and face hard to push fluid in.",c:"Heavy massage moves fluid out of those areas. The fingers dried more. (EHTP p. 306)"}]},
  b5m:{t:"The fingers",s:"Injection is running. The fingertips on her right hand are still pale and haven't taken any dye.",o:[
   {t:"Lower the right arm over the side of the table, massage along the radial and ulnar arteries, then the sides of the fingers, and press the nail beds. Keep it gentle.",ok:1,next:"b6",c:"Lowering the arm expands the vessels, and massage along the arterial route draws solution into the fingers. She's already dehydrated, so avoid over-manipulation. It doesn't always work, but here the fingertips pinked up. (EHTP p. 204)"},
   {t:"Raise the arm above the table so gravity helps.",c:"Lowering the hand below the table expands the vessels. Raising it does the opposite. (EHTP p. 204)"},
   {t:"Turn the pressure up as high as it goes.",c:"A big pressure jump swelled the face before the fingers cleared. Try positioning and massage first. (EHTP p. 204)"},
   {t:"Inject the fingertips with tissue builder now.",c:"Tissue builder goes in after arterial injection, and the fingers still need preservative first. (EHTP p. 118)"}]},
  b6:{t:"The left hand",ev:"Watch the hand",s:"Injection is still running. The left hand, where the IV leaked into the tissue, is swollen and pits when you press it.",o:[
   {t:"Switch the whole tank to a strong, dehydrating solution and reinject.",c:"The hand improved, but the rest of her dried out. The face wrinkled."},
   {t:"Elevate the arm and massage the hand and forearm toward the heart while injection continues.",ok:1,next:"b7",c:"Pitting edema can be moved by gravity and massage. Raising the arm and massaging toward the heart moves the fluid out of the hand and into the drainage. (EHTP p. 232)"},
   {t:"Squeeze the edema out through the IV puncture and seal it with super adhesive.",c:"Forcing fluid through the puncture stretched and tore the fragile skin around it. Elevation and massage toward the heart move the fluid without stressing the skin."},
   {t:"Lance the back of the hand and leave it to drain.",c:"Lancing a visible hand left openings that leaked and showed at the viewing. (EHTP p. 311)"},
   {t:"Leave it. It will go down by itself.",c:"The humectant solution added more moisture. The hand stayed swollen."}]},
  b7:{t:"Hollow features",s:"Injection is done. The face filled out some, but the temples are still a little hollow.",o:[
   {t:"Inject a small amount of tissue builder by hypodermic needle into the temples, being careful not to overfill.",ok:1,next:"b8",c:"Tissue builder is injected after arterial embalming to restore sunken areas. It's almost impossible to remove once it's in. (EHTP pp. 118 to 119)"},
   {t:"Reopen the femoral and inject more arterial solution into the head.",c:"The face firmed more but didn't fill out. The extra preservative dried the tissue."},
   {t:"Leave it. Cosmetics will hide the hollows.",c:"The shadows from the hollows still showed under the chapel lights."}]},
  b8:{t:"Lips and hands",s:"You're finishing up. The lips are hard, brown, and curling at the edges, and the fingertips are wrinkled.",o:[
   {t:"Reapply massage cream to the face and hands. The lips are desiccated and can't be rehydrated, so restore them with wax and opaque cosmetics. Fill the fingertips with tissue builder.",ok:1,end:1,c:"Moisture cannot be restored to desiccated tissue. Restorative wax and opaque cosmetics cover it. Tissue builder smooths wrinkled fingertips. (EHTP p. 305; p. 304)"},
   {t:"Soak the lips with massage cream overnight to rehydrate them.",c:"Desiccated tissue can't be rehydrated. The lips looked the same in the morning. (EHTP p. 305)"},
   {t:"Use a strong cavity fluid compress on the lips.",c:"The compress dried and darkened the lips further."}]}
 }
},
{
 code:"W12-C",
 look:{sex:"m",head:64,hair:"#d0ccc5",hairStyle:"fringe",eyes:"normal",lips:"dry",cheeks:"puffy",temples:false,purge:false,abd:false,arm:40,rhand:1,lhand:1,lIV:false,thigh:62,lower:86,gloss:true,pits:true,wrinkledR:true},
 file:{Decedent:"Male, 88",Cause:"Complications of stroke; bedfast 3 months",History:"Long-term steroid therapy for COPD",Place:"Nursing home",Interval:"5 hours, refrigerated",Service:"Open casket, viewing tomorrow evening"},
 request:"The steroids made his face so round. We know he won't look like he used to, but we'd like him to look rested.",
 exam:{
  face:{o:"Cheeks, jaw, and neck are full and round. The tissue feels firm, and pressing it leaves no dent.",a:"Non-pitting (solid) edema"},
  mouth:{o:"Lips dry and brown at the edges. The edges feel hard.",a:"Desiccation"},
  chest:{o:"Skin intact. No swelling or skin breaks.",a:"No moisture-related finding"},
  abd:{o:"Soft, not distended. No fluid wave.",a:"No moisture-related finding"},
  rarm:{o:"Skin on the back of the hand stays up in a ridge when pinched. Fingertips are wrinkled.",a:"Dehydration"},
  larm:{o:"Normal size. Skin intact.",a:"No moisture-related finding"},
  rleg:{o:"Lower leg, ankle, and foot swollen, heavy, and shiny. Pressing leaves a pit that stays.",a:"Pitting edema"},
  lleg:{o:"Lower leg, ankle, and foot swollen and shiny. A fingertip press leaves a dent that stays. Skin intact.",a:"Pitting edema"}
 },
 start:"c1",
 nodes:{
  c1:{t:"The plan",s:"His face has solid edema from the steroids and his legs have pitting edema. What is your plan?",o:[
   {t:"One-point injection with one strong, high-index solution for the whole body",c:"The legs firmed, but the large volume of strong solution reaching the face made it firmer and grayer without bringing it down."},
   {t:"One-point injection with a large volume of mild solution",c:"Mild solution in large volume swelled the face more and the legs never firmed."},
   {t:"Restricted cervical injection for the trunk and arms, a small separate injection to the head, and a stronger separate injection to each leg",ok:1,next:"c2",c:"Restricted cervical injection keeps extra solution out of the swollen face, and the legs get their own strong injection. (EHTP p. 183; p. 310)"},
   {t:"Inject only the legs and rely on cavity treatment for the rest",c:"The head and upper body were never arterially preserved. The face discolored by the next day."}]},
  c2:{t:"Vessels",s:"Which vessels support that plan?",o:[
   {t:"Right common carotid only",c:"From one point you can't control what reaches the face or change strength for the legs."},
   {t:"Both common carotids and the right internal jugular for the trunk, arms, and head, plus the femoral arteries for the legs",ok:1,next:"c2h",c:"Both carotids give you restricted cervical injection, and the femorals give you separate control of the legs. The carotids are rarely sclerotic in an older body. (EHTP p. 183; p. 315)"},
   {t:"Radial arteries only",c:"The radials are small and far from the legs and face. You had no control of distribution."},
   {t:"Right femoral only, toward the head",c:"Injecting toward the head from the femoral sends solution to both sides of the face at once. That is the opposite of what a swollen face needs."}]},

  } else if(e.done) nextBtn=`<button class="btn" id="go">Continue</button>`;
  const body=shelf?vShelf(c,node,e):`<div class="choices list">${node.o.map((o,i)=>{const tried=e.tries.includes(i);return `<button class="choice${e.done&&o.ok?" right":tried&&!o.ok?" wrong":""}" data-i="${i}" ${e.done||tried||(last&&last.go)?"disabled":""}>${esc(o.t)}</button>`}).join("")}</div>`;
  const nSteps=S.path.filter(p=>p.done).length;
  app.innerHTML=`<section class="treat${shelf?" shelfmode":""}">
    ${shelf?"":`<div class="chart tfig">${figure(c,{id:"t"})}</div>`}
    <div class="panel stack tq" id="tq">
     <div class="qhead"><h2>${esc(node.t)}</h2><span class="qcount">${c.code}</span></div>
     ${node.ev?`<span class="event">${esc(node.ev)}</span>`:""}
     <p class="scene">${esc(node.s)}</p>
     ${shelf?`${body}${nextBtn}`:`${fb}${nextBtn}${body}`}
    </div>
    <div class="stack thist">
     <details class="panel hist" ${innerWidth>820?"open":""}><summary><h3>Steps completed (${nSteps})</h3></summary>${trail?`<ol class="trail">${trail}</ol>`:`<p class="muted">None yet.</p>`}</details>
     <details class="panel hist" ${innerWidth>820?"open":""}><summary><h3>Your examination findings</h3></summary>${examDone()?`<ul class="findings">${REGIONS.map(r=>`<li><span>${r.name}</span><span class="v">${esc(c.exam[r.id].a)}</span></li>`).join("")}</ul>`:`<p class="muted">Finish the exam to see your findings here.</p>`}</details>
    </div></section>`;
  if(shelf){
    app.querySelectorAll(".bottle").forEach(b=>b.onclick=()=>{const id=b.dataset.b;const bo=BOTTLES.find(x=>x.id===id);e.last=id;e.lockMsg=null;
      if(!e.items.includes(id))e.items.push(id);
      if(bo.cat!=="neutral"&&bo.cat!=="aid"&&!e.tries.includes(id))e.tries.push(id);
      keep()});
    app.querySelectorAll(".rm").forEach(b=>b.onclick=()=>{e.items=e.items.filter(x=>x!==b.dataset.rm);e.last=null;e.lockMsg=null;keep()});
    app.querySelectorAll(".sb").forEach(b=>b.onclick=()=>{const k=b.dataset.k,d=+b.dataset.d;const lim={gal:[1,3,.5],artN:[0,6,.5],coN:[.5,4,.5]}[k];
      e[k]=Math.min(lim[1],Math.max(lim[0],Math.round((e[k]+d*lim[2])*100)/100));e.lockMsg=null;keep()});
    const lock=document.getElementById("lock");
    if(lock)lock.onclick=()=>{const m=mixOf(e,node);const mx=node.mix;e.last=null;
      const wrong=e.items.filter(id=>{const bo=BOTTLES.find(x=>x.id===id);return bo.cat!=="neutral"&&bo.cat!=="aid"&&id!==node.need.art&&id!==node.need.co&&!(node.opt||[]).includes(id)});
      if(wrong.length){e.misses++;e.lockMsg=`The tank has the wrong chemical for this case: ${wrong.map(id=>BOTTLES.find(x=>x.id===id).sub).join(", ")}. ${node.fb[wrong[0]]||""} Fix the tank and lock it in again.`}
      else if(m.st<mx.min){e.misses++;e.lockMsg=`${fmt(m.st)}% is too weak. ${mx.low} Adjust the tank and lock it in again.`}
      else if(m.st>mx.max){e.misses++;e.lockMsg=`${fmt(m.st)}% is too strong. ${mx.high} Adjust the tank and lock it in again.`}
      else if(!coOk(e,mx)){e.misses++;e.lockMsg=`The strength is right, but ${bt(e.coN)} of co-injection is off for this tank. Use ${coRule(mx)}. ${mx.co==="eq"?"The book recommends equal amounts of co-injection and arterial fluid, and too much humectant dehydrates (EHTP p. 306).":"How much edema corrective to use depends on how severe the edema is (EHTP p. 117)."} Adjust and lock it in again.`}
      else{e.done=true;e.aid=e.items.includes("b9");e.dye=e.items.includes("b6");e.final={gal:e.gal,artN:e.artN,coN:e.coN,st:m.st,aoz:m.aoz,coz:m.coz,idx:m.idx,items:[...e.items]};e.lockMsg=`${fmt(m.st)}%${m.hasCo?` with ${bt(e.coN)} of co-injection`:""} is right for this case. ${mx.good}`}
      keep()};
  } else app.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;e.tries.push(i);if(node.o[i].ok)e.done=true;keep()});
  const go=document.getElementById("go");
  if(go)go.onclick=()=>{
    if(shelf){S.cur=node.next;render();return}
    const l=node.o[e.tries[e.tries.length-1]];
    if(l.go){e.done=true;e.went=e.tries[e.tries.length-1];S.cur=l.go;render()} else if(l.end){S.finished=true;S.step=4;render()} else {S.cur=l.next;render()}};
}
const wrongShelf=(p,nd)=>p.tries.filter(id=>id!==nd.need.art&&id!==nd.need.co);
function scores(){
  const c=C();const ex=REGIONS.filter(r=>S.exam[r.id]&&S.exam[r.id].tries.length===1).length;
  const steps=S.path.filter(p=>p.done);
  const tr=steps.filter(p=>{const nd=c.nodes[p.id];return nd.type==="shelf"?(wrongShelf(p,nd).length===0&&!p.misses):(p.tries.length===1&&p.went==null)}).length;
  const detours=S.path.filter(p=>c.nodes[p.id].ev==="Things got worse").length;
  return {ex,exN:REGIONS.length,tr,trN:steps.length,detours};
}
function words(s){return s.trim().split(/\s+/).filter(Boolean).length}
const MINS={diff:25,feedback:10};
function reportText(){
  const c=C();const s=scores();const d=new Date();const bn=id=>{const b=BOTTLES.find(x=>x.id===id);return b.name+" ("+b.sub+")"};
  let t=`MRTS 2244 WEEK 12 LAB: MOISTURE CASE REPORT\n`;
  t+=`Student: ${S.name.trim()}\nCase file: ${c.code} (chosen by student)\nCompleted: ${d.toLocaleString()}\n`;
  const tm=S.path.filter(p=>p.done&&c.nodes[p.id].type==="shelf").reduce((a,p)=>a+(p.misses||0),0);
  t+=`SCORES: Exam ${s.ex}/${s.exN} on first check (${S.examRound||1} check${(S.examRound||1)>1?"s":""}) | Decisions ${s.tr}/${s.trN} on first try | Complications caused ${s.detours} | Tanks rejected ${tm}\n\n`;
  t+=`DECEDENT\n`;Object.entries(c.file).forEach(([k,v])=>t+=`${k}: ${v}\n`);
  t+=`Family request: "${c.request}"\n\n`;
  t+=`PRE-EMBALMING ANALYSIS (correct on first check: ${s.ex} of ${s.exN})\n`;
  REGIONS.forEach(r=>{const st=S.exam[r.id]||{tries:[]};t+=`- ${r.name}: ${c.exam[r.id].a}`;if(st.tries.length>1)t+=` [${st.tries.length} attempts; also chose ${st.tries.slice(0,-1).join(", ")}]`;t+=`\n`});
  t+=`\nEMBALMING DECISIONS (correct on first try: ${s.tr} of ${s.trN}; complications caused by choices: ${s.detours})\n`;
  S.path.filter(p=>p.done).forEach((p,i)=>{const nd=c.nodes[p.id];
    t+=`${i+1}. ${nd.t}${nd.ev==="Things got worse"?" (complication from an earlier choice)":""}\n`;
    if(nd.type==="shelf"){const f=p.final;t+=`   Chemicals: ${(f.items||[nd.need.art,nd.need.co].filter(Boolean)).map(bn).join(" + ")}\n   Mix: ${fmt(f.gal)} gal tank (${f.gal*128} oz), ${bt(f.artN)} arterial (${f.aoz} oz)${f.coz?`, ${bt(f.coN)} co-injection (${f.coz} oz)`:""}\n   Strength: (${f.aoz} x ${f.idx}) / ${f.gal*128} = ${fmt(f.st)}%\n`;if(p.misses)t+=`   Tanks locked in wrong first: ${p.misses}\n`;const w=wrongShelf(p,nd);if(w.length)t+=`   Wrong bottles tried: ${w.map(bn).join(" | ")}\n`;}
    else if(p.went!=null){t+=`   Chose: ${nd.o[p.went].t}\n   Result: ${nd.o[p.went].c} This caused a complication.\n`;if(p.tries.length>1)t+=`   Earlier choices: ${p.tries.slice(0,-1).map(j=>nd.o[j].t).join(" | ")}\n`;}
    else{t+=`   Final: ${nd.o.find(o=>o.ok).t}\n`;if(p.tries.length>1)t+=`   Earlier choices: ${p.tries.slice(0,-1).map(j=>nd.o[j].t).join(" | ")}\n`;}});
  const f=(k,blank)=>S.ref[k].trim()||blank;
  t+=`\nWHAT I WOULD DO DIFFERENTLY\n${f("diff","[Not written yet]")}\n`;
  t+=`\nMY FEEDBACK ON THIS LAB\n${f("feedback","[Not written yet]")}\n`;
  return t;
}
function missing(){return Object.entries(MINS).filter(([k,n])=>words(S.ref[k])<n)}
function vFunEnd(){
  const s=scores();const c=C();
  app.innerHTML=`<section class="stack"><div class="panel stack">
   <h2>${S.finished?`Nice work. You finished Case ${esc(c.code.slice(-1))}.`:`Your scores so far on Case ${esc(c.code.slice(-1))}`}</h2>
   <div class="score"><div><b>${s.ex}/${s.exN}</b><small>Analysis, first check</small></div><div><b>${s.tr}/${s.trN}</b><small>Decisions, first try</small></div><div><b>${s.detours}</b><small>Complications caused</small></div></div>
   <p class="muted">You played for fun, so there's no report to submit. If this is for a grade, go back to Sign in and choose For an assignment.</p>
   <h3>Try another case</h3><div class="row" style="flex-wrap:wrap;gap:8px">${CASES.map((cc,i)=>`<button class="btn ${i===S.ci?"":"ghost"}" data-ci="${i}">Case ${esc(cc.code.slice(-1))}${i===S.ci?" again":""}</button>`).join("")}</div>
  </div></section>`;
  app.querySelectorAll("[data-ci]").forEach(b=>b.onclick=()=>startCase(+b.dataset.ci));
}
const unfinished=()=>[2,3].filter(k=>!secDone(k)).map(k=>SECT[k]);
const copyHint=()=>{const u=unfinished();return u.length?"Finish first: "+u.join(", "):missing().length?"Finish both boxes to copy":""};
function vReport(){
  if(S.mode==="fun")return vFunEnd();
  const s=scores();
  const box=(k,label,help)=>`<div class="stack" style="gap:6px"><label for="r_${k}">${label}</label>${help?`<p class="muted" style="font-size:.88rem">${help}</p>`:""}<textarea id="r_${k}" data-k="${k}">${esc(S.ref[k])}</textarea><span class="progress" id="w_${k}">${words(S.ref[k])} of ${MINS[k]} words</span></div>`;
  app.innerHTML=`<section class="stack">
   <div class="panel stack">
    <h2>Case report</h2>${unfinished().length?`<div class="note warn">You haven't finished ${unfinished().join(" and ")}. Use the steps at the top to go back. You can copy your report once both are done.</div>`:""}
    <div class="score"><div><b>${s.ex}/${s.exN}</b><small>Analysis, first check</small></div><div><b>${s.tr}/${s.trN}</b><small>Decisions, first try</small></div><div><b>${s.detours}</b><small>Complications caused</small></div></div>
    ${box("diff","1. What would you do differently?","Think beyond the choices you were given. What would you add, change, or try on this case if you were in the prep room? Products, techniques, timing, anything.")}

   </div>
   <div class="reportbox">
    <div class="bar2"><span>Your report: copy all of this into Blackboard</span><span class="row" style="gap:10px"><span id="chint" style="font-size:.82rem">${copyHint()}</span><button class="btn" id="copy" ${copyHint()?"disabled":""}>Copy report</button></span></div>
    <pre class="report" id="rep">${esc(reportText())}</pre>
   </div>
   <div class="note warn" id="cmsg" hidden></div>
   <div class="panel stack" id="another" ${S.copied?"":"hidden"}><h3>Try another case</h3><p class="muted">Paste this report into Blackboard first. Starting a new case clears it.</p><div class="row">${CASES.map((cc,i)=>i===S.ci?"":`<button class="btn ghost" data-ci="${i}">Case ${cc.code}</button>`).join("")}</div></div>
   <p class="muted">Paste the report into the Week 12 Lab submission in Blackboard. If the copy button doesn't work, click in the report, press Ctrl+A (Cmd+A on a Mac) to select it, then Ctrl+C to copy.</p>
   <button class="btn ghost" id="back">Back to the last decision</button>
  </section>`;
  const cm=document.getElementById("cmsg");
  app.querySelectorAll("textarea[data-k]").forEach(ta=>ta.addEventListener("input",()=>{const k=ta.dataset.k;S.ref[k]=ta.value;document.getElementById("w_"+k).textContent=`${words(S.ref[k])} of ${MINS[k]} words`;document.getElementById("rep").textContent=reportText();const h=copyHint();document.getElementById("copy").disabled=!!h;document.getElementById("chint").textContent=h;if(!h&&cm.className.includes("warn"))cm.hidden=true}));
  document.getElementById("copy").onclick=()=>{
    if(unfinished().length){cm.className="note warn";cm.textContent="Finish "+unfinished().join(" and ")+" before you copy.";cm.hidden=false;return}
    const m=missing();
    if(m.length){const names={diff:"what you would do differently",feedback:"your feedback"};cm.className="note warn";cm.textContent="Finish these before you copy: "+m.map(([k,n])=>`${names[k]} (${n} words minimum)`).join(", ")+".";cm.hidden=false;document.getElementById("r_"+m[0][0]).focus();return}
    const txt=reportText();const done=()=>{cm.className="note ok";cm.textContent="Copied. Paste it into the Week 12 Lab submission in Blackboard.";cm.hidden=false;S.copied=true;document.getElementById("another").hidden=false};
    try{navigator.clipboard.writeText(txt).then(done,()=>sel(cm))}catch(e){sel(cm)}};
  document.getElementById("back").onclick=()=>{S.step=3;render()};
  app.querySelectorAll("#another [data-ci]").forEach(b=>b.onclick=()=>startCase(+b.dataset.ci));
}
function sel(m){const pre=document.getElementById("rep");const r=document.createRange();r.selectNodeContents(pre);const s=getSelection();s.removeAllRanges();s.addRange(r);m.className="note ok";m.textContent="The report is selected. Press Ctrl+C (Cmd+C on a Mac) to copy it.";m.hidden=false;S.copied=true;const a=document.getElementById("another");if(a)a.hidden=false}
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="a"&&document.activeElement&&document.activeElement.tagName!=="TEXTAREA"&&document.activeElement.tagName!=="INPUT"&&document.getElementById("rep")){e.preventDefault();const r=document.createRange();r.selectNodeContents(document.getElementById("rep"));const s=getSelection();s.removeAllRanges();s.addRange(r)}});
render();
</script>
