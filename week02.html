<style>

.findbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;background:var(--surface);border:2px solid var(--accent);border-radius:8px;padding:8px 12px;margin-bottom:8px;animation:pop 1.1s ease-out}
.findbar.ok{border-color:var(--ok);animation:none}
.findbar .fk{font-family:var(--f-mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.findbar .ft{font-family:var(--f-display);font-weight:700;font-size:1.35rem;line-height:1.1;flex:1 1 auto}
.findbar .fm{flex-basis:100%;font-size:.9rem;color:var(--warn);background:var(--warn-soft);border-radius:4px;padding:4px 8px}
.navar{display:inline-flex;gap:6px}
.arw{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-size:1.4rem;line-height:1;display:inline-flex;align-items:center;justify-content:center;padding:0}
.arw:hover{border-color:var(--accent);color:var(--accent)}
.mback{position:fixed;inset:0;background:rgba(20,26,30,.45);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:50;animation:fadein .2s ease-out}
.modal{background:var(--surface);color:var(--ink);border:3px solid var(--accent);border-radius:12px;max-width:560px;width:100%;max-height:100%;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:10px;box-shadow:0 18px 50px rgba(0,0,0,.35);animation:bubble .28s ease-out}
.mhead{display:flex;justify-content:space-between;align-items:center}
.mhead .fk{font-family:var(--f-mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
@keyframes bubble{from{transform:translateY(14px) scale(.96);opacity:0}to{transform:none;opacity:1}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
body.modal-open{overflow:hidden}
.mback.still,.mback.still .modal{animation:none}
@media (prefers-reduced-motion:reduce){.modal,.mback,.findbar{animation:none}}
.scenefig{background:var(--table);border:1px solid var(--table-edge);border-radius:10px;padding:10px}
.scenefig svg{width:100%;height:auto;display:block;border-radius:6px}
.dots{display:flex;flex-wrap:wrap;gap:5px}
.dots button{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:var(--muted);font-size:.72rem;font-weight:700;padding:0}
.dots button.done{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.dots button.cur{border-color:var(--accent);color:var(--accent)}
.steps li.nav{cursor:pointer}
.steps li.nav:hover,.steps li.nav:focus-visible{border-color:var(--accent);color:var(--accent);outline:none}
.cases{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.casepick{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:8px;padding:10px 12px;line-height:1.3}
.casepick .cn{font-weight:700}
.casepick .cd{font-size:.82rem;color:var(--muted)}
.casepick:hover{border-color:var(--accent)}
.casepick.on{border-color:var(--accent);background:var(--bg);box-shadow:inset 0 0 0 1px var(--accent)}

 {t:"You need to find the artery in the incision and lift it up out of the tissue.",a:"hook",also:["needle"],c:"Aneurysm hooks and aneurysm needles are both curve-tipped instruments for blunt dissection to locate and raise arteries and veins. (EHTP p. 73)"},
 {t:"The artery is raised. You need to pass ligature thread underneath it.",a:"needle",c:"The aneurysm needle has an eye in its hook for passing suture thread around a vessel. (EHTP p. 73)"},
 {t:"The artery and vein are raised. You need something to keep them up above the incision while you work.",a:"separator",c:"The separator keeps vessels elevated above the incision. (EHTP p. 74)"},
 {t:"You need to open the artery without cutting all the way through it.",a:"ascissors",c:"Arterial scissors have an angled tip and short blades so you don't cut through the vessel. (EHTP p. 74)"},
 {t:"The arterial tube is in. You need to hold it securely in the artery.",a:"hemostat",c:"The arterial hemostat holds the arterial tube securely in the artery. (EHTP p. 73)"},
 {t:"You need to start and stop the flow of solution between the delivery hose and the arterial tube.",a:"stopcock",c:"The stopcock attaches to the delivery hose and starts and stops the flow into the artery. (EHTP p. 76)"},
 {t:"Drainage from the internal jugular vein is full of clots. You need to grasp them and pull them out.",a:"forceps",c:"Angular spring forceps go into the internal jugular toward the heart and grasp clotted material. (EHTP p. 77)"},
 {t:"You need to expand the vein and guide the drain tube into it.",a:"director",c:"The grooved director expands the vein and guides a drain tube into place. (EHTP p. 78)"},
 {t:"An autopsied body: you want to inject both legs at the same time.",a:"ytube",c:"The Y-tube lets you inject both legs, both arms, or both sides of the head at once. (EHTP p. 76)"},
 {t:"Arterial injection is done. You need to aspirate the body cavities.",a:"trocar",c:"The trocar is a long hollow needle used for cavity aspiration and injection. (EHTP p. 78)"},
 {t:"Aspiration is done. You need to close the trocar opening.",a:"button",c:"The trocar button is a threaded nylon device that closes the trocar insertion site. (EHTP p. 79)"},
 {t:"An autopsied body: blood and arterial solution are collecting in the open trunk cavities during injection.",a:"autopsy",c:"The autopsy aspirator has large holes or slots in its head so it doesn't clog, and it aspirates what collects in the autopsied cavities. (EHTP p. 78)"},
 {t:"Purge is coming from the nose. You need limited aspiration of the nasal passages and throat.",a:"nasal",c:"The nasal tube aspirator attaches to the aspirating hose and goes into the nostril or throat for limited aspiration. (EHTP p. 78)"},

function scores(){
  const c=C();const L=S.find?S.find.log:{};const ids=ITEMS.map(i=>i.id);
  const found1=ids.filter(id=>L[id]&&L[id].stage==="done"&&L[id].misses.length===0).length;
  const misses=ids.reduce((a,id)=>a+(L[id]?L[id].misses.length:0),0);
  const fix1=ids.filter(id=>L[id]&&L[id].fix.length===1).length;
  const instFirst=TASKS.filter((t,i)=>S.inst.log[i]&&S.inst.log[i].done&&S.inst.log[i].tries.length===1).length;
  const steps=S.path.filter(p=>p.done);const scFirst=steps.filter(p=>p.tries.length===1&&p.went==null).length;
  const detours=S.path.filter(p=>SC.nodes[p.id].ev==="Things got worse").length;
  return {found1,misses,fix1,instFirst,scFirst,scN:steps.length,detours,ppe:S.ppe.tries};
}

function reportText(){

  t+=`ROOM INSPECTION\n`;S.find.order.forEach((id,n)=>{const it=ITEMS.find(x=>x.id===id);const l=S.find.log[id];const L=choiceList(it);const fin=L.find(o=>o.ok);t+=`${n+1}. ${it.name}: ${isBad(id)?"PROBLEM":"set up correctly"}`;if(l.misses.length)t+=` [clicked ${l.misses.map(m=>ITEMS.find(x=>x.id===m).name).join(", ")} first]`;t+=`\n`;if(isBad(id))t+=`   Fix: ${fin.t}\n`;if(l.fix.length>1)t+=`   Earlier choices: ${l.fix.slice(0,-1).map(j=>L[j].t).join(" | ")}\n`});

}
